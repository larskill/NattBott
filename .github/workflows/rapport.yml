name: Lag rapporten på nytt

on:
  workflow_dispatch:
    inputs:
      dato:
        description: "Dato (ÅÅÅÅ-MM-DD). La stå tom for i dag."
        required: false
      bygg_demoer:
        description: "Lag demo-sidene på nytt med nyeste design (og bilder)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nattmaskin
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Lag rapporten på nytt
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
        run: python3 nattmaskin.py gjenskap "${{ inputs.dato }}" ${{ inputs.bygg_demoer && '--bygg-demoer' || '' }}
      - name: Krypter og publiser
        env:
          RAPPORT_PASSORD: ${{ secrets.RAPPORT_PASSORD }}
        run: python3 nattmaskin.py publiser-rapport "${{ inputs.dato }}"
      - name: Lagre
        run: |
          git config user.name "nattmaskin"
          git config user.email "nattmaskin@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Rapport ${{ inputs.dato }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
