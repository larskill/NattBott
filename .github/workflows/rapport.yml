name: Lag rapporten på nytt

on:
  workflow_dispatch:
    inputs:
      dato:
        description: "Dato (ÅÅÅÅ-MM-DD). La stå tom for i dag."
        required: false
      oppgrader:
        description: "Orgnr som skal legges til som oppgradering (kommaseparert)"
        required: false
      sjekk_nettsider:
        description: "Sjekk på nytt om bedriftene har nettside (fjerner demoene deres)"
        type: boolean
        default: false
      bygg_demoer:
        description: "Lag alle aktive demo-sider på nytt med nyeste design (og bilder)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nattmaskin
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Legg til oppgraderinger
        if: ${{ inputs.oppgrader != '' }}
        run: python3 nattmaskin.py oppgrader "${{ inputs.oppgrader }}" "${{ inputs.dato }}"
      - name: Sjekk nettsider på nytt
        if: ${{ inputs.sjekk_nettsider }}
        env:
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
        run: python3 nattmaskin.py sjekk-igjen "${{ inputs.dato }}"
      - name: Lag den samlede rapporten
        env:
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
        run: python3 nattmaskin.py samlerapport ${{ inputs.bygg_demoer && '--bygg-demoer' || '' }}
      - name: Krypter og publiser
        env:
          RAPPORT_PASSORD: ${{ secrets.RAPPORT_PASSORD }}
        run: python3 nattmaskin.py publiser-rapport "${{ inputs.dato }}"
      - name: Lagre
        run: |
          git config user.name "nattmaskin"
          git config user.email "nattmaskin@users.noreply.github.com"
          git add -A docs data/sett.json $(ls data/unsplash_brukt.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "Rapport ${{ inputs.dato }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
